name: Database Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations and seed
        run: supabase db reset

      - name: Run database and RLS tests
        run: supabase test db

      - name: Run Auth integration tests
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL
          export MAILPIT_URL="http://127.0.0.1:54324"

          for test_file in supabase/tests/auth/*.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done

      - name: Run MVP route smoke
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"

          ./node_modules/.bin/next dev -p 3000 > /tmp/idaily-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/idaily-next.log
              exit 1
            fi
            sleep 1
          done

          for route in / /login /register /password/recovery; do
            curl -fsS "http://127.0.0.1:3000$route" >/dev/null
          done

          for route in /dashboard /customers /customers/new /activities /activities/new /notifications /notifications/new /notifications/c5000000-0000-4000-8000-000000000001/edit /reports /personnel /admin/accounts /admin/roles /admin/roles/new /admin/roles/c6000000-0000-4000-8000-000000000001/edit /password/change; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")"
            case "$status" in
              301|302|303|307|308) ;;
              *)
                echo "Expected auth redirect for $route, got HTTP $status"
                cat /tmp/idaily-next.log
                exit 1
                ;;
            esac
          done

          export_status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/reports/export?period=day&anchor=2026-10-06")"
          if [ "$export_status" != "401" ]; then
            echo "Report export must reject unauthenticated requests, got HTTP $export_status"
            cat /tmp/idaily-next.log
            exit 1
          fi

          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          trap - EXIT

      - name: Run form resilience browser checks
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"

          npm exec --yes --package=playwright -- playwright install --with-deps chromium

          ./node_modules/.bin/next dev -p 3000 > /tmp/idaily-browser.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/idaily-browser.log
              exit 1
            fi
            sleep 1
          done

          if ! npm exec --yes --package=playwright -- sh -c 'NODE_PATH="$(dirname "$(dirname "$(command -v playwright)")")" node tests/form-resilience-browser.cjs'; then
            cat /tmp/idaily-browser.log
            exit 1
          fi

          cp tests/phase6-visual-screenshots.cjs /tmp/phase6-visual-screenshots.cjs
          if ! PHASE6_SCREENSHOT_PREFIX=after- PHASE6_SOURCE_SHA="$GITHUB_SHA" npm exec --yes --package=playwright -- sh -c 'NODE_PATH="$(dirname "$(dirname "$(command -v playwright)")")" node tests/phase6-visual-screenshots.cjs'; then
            cat /tmp/idaily-browser.log
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          trap - EXIT

          # Re-run the same route/viewport matrix on the pre-fix baseline.
          # Baseline overflow is recorded but is not allowed to fail the post-fix gate.
          git checkout --detach 1aeb11802438c53583a587b9fb25c7d62daa6223
          npm ci
          cp /tmp/phase6-visual-screenshots.cjs tests/phase6-visual-screenshots.cjs
          ./node_modules/.bin/next dev -p 3000 > /tmp/idaily-browser-baseline.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/idaily-browser-baseline.log
              exit 1
            fi
            sleep 1
          done

          if ! PHASE6_SCREENSHOT_PREFIX=before- PHASE6_SOURCE_SHA=1aeb11802438c53583a587b9fb25c7d62daa6223 PHASE6_CAPTURE_ONLY=true npm exec --yes --package=playwright -- sh -c 'NODE_PATH="$(dirname "$(dirname "$(command -v playwright)")")" node tests/phase6-visual-screenshots.cjs'; then
            cat /tmp/idaily-browser-baseline.log
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload Phase 6 visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-visual-acceptance-${{ github.sha }}
          path: artifacts/phase6/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
