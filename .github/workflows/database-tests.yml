name: Database Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations and seed
        run: supabase db reset

      - name: Run database and RLS tests
        run: supabase test db

      - name: Run Auth integration tests
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          API_URL="$API_URL" \
          ANON_KEY="$ANON_KEY" \
          SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          for test_file in supabase/tests/auth/*.mjs; do
            echo "Running $test_file"
            API_URL="$API_URL" \
            ANON_KEY="$ANON_KEY" \
            SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            MAILPIT_URL="http://127.0.0.1:54324" \
            node "$test_file"
          done

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
